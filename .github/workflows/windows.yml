name: Windows build and release
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: powershell
        run: .\build.ps1
      - name: Test
        shell: powershell
        run: .\test.ps1
      - name: Package
        shell: powershell
        run: |
          $files = @('CodexCompactCounter.exe','Install.cmd','Install.ps1','Uninstall.ps1','Uninstall.cmd','Start.cmd','README.md','LICENSE','docs')
          Get-FileHash CodexCompactCounter.exe -Algorithm SHA256 | ForEach-Object { $_.Hash.ToLowerInvariant() + '  CodexCompactCounter.exe' } | Set-Content SHA256.txt
          Compress-Archive -LiteralPath ($files + 'SHA256.txt') -DestinationPath CodexCompactCounter-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CodexCompactCounter-Windows
          path: CodexCompactCounter-Windows.zip
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$env:GITHUB_REF_NAME" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:GITHUB_REF_NAME" CodexCompactCounter-Windows.zip SHA256.txt --clobber
          } else {
            gh release create "$env:GITHUB_REF_NAME" CodexCompactCounter-Windows.zip SHA256.txt --title "$env:GITHUB_REF_NAME" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
